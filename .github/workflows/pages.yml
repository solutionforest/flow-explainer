# Backup mirror on GitHub Pages (primary host remains Laravel Cloud).
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble public site
        run: |
          mkdir -p _site
          cp index.html 3d.html core.mjs embed.js diagram-styles.json diagram-styles.schema.json og-image.png favicon.svg favicon.ico apple-touch-icon.png site.webmanifest robots.txt sitemap.xml _site/
          cp -R vendor docs examples diagram-styles _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          # .nojekyll is hidden; v4+ excludes dotfiles unless this is set.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
